interface:
  display_name: "爆款词根"
  short_description: "审核八大元素词根并同步热度词典与选题明细"
  default_prompt: >-
    使用 $future2046-viral-root 同步爆款词根工作区。先检查是否存在未完成的严格“最差”复核；有复核时只按极端词白名单审核，复核期间锁定普通拆解。无复核阻断后再按账号逐个处理，每批只开放10条；每条先做标题语义概括和八类逐项排查，再提炼标准词根、核对原文证据并交独立 AI 复核。“最差”只允许标题直接出现白名单中的最坏、最差、最难吃、最难喝、最难用、最垃圾、最失败、最糟糕、极差、极烂或一文不值等极端表达；没人看、没流量、四不像、失败、死局等不再命中。当前批次完成落盘后程序才解锁下一批；账号最后一批完成后，必须先同步截至当前已完成账号的正式词典、汇总和编号目录明细，且同步成功后才允许确认并解锁下一个账号。无词根标题也要保存排除理由；驳回项记入审计记录，有争议项暂停并交用户裁定。同步前运行生产预检和 dry-run，确认来源完整、无待审核项、路径安全和链接有效；提交失败时保持账号等待状态并恢复本轮受管产物。
