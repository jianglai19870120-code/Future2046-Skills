name: Future2046 integrity checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository tools
        run: python -m pip install -r requirements.txt
      - name: Validate registry, links and declared Skill tests
        run: python tools/validate_repository.py --root .
      - name: Test temporary second Skill
        run: python tools/test_multiskill_framework.py --root .
      - name: Build public release
        run: python tools/build_release.py --root .
      - name: Test release from clean extraction
        run: python tools/test_release_install.py --root .
